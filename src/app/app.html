    <path d="M3 8l9 5 9-5M12 13v8" /></svg

<ng-template appNavIcon="stacks"
  ><svg viewBox="0 0 24 24">
    <path d="M12 3l9 4.5-9 4.5-9-4.5z" />
    <path d="M3 12l9 4.5 9-4.5M3 16.5L12 21l9-4.5" /></svg
></ng-template>
<ng-template appNavIcon="images"
  ><svg viewBox="0 0 24 24">
    <rect x="3" y="4" width="18" height="16" rx="2" />
    <circle cx="9" cy="10" r="1.5" />
    <path d="M21 16l-5-5-8 8" /></svg

<ng-template appNavIcon="volumes"
  ><svg viewBox="0 0 24 24">
    <ellipse cx="12" cy="6" rx="8" ry="3" />
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3" /></svg

<ng-template appNavIcon="networks"
  ><svg viewBox="0 0 24 24">
    <circle cx="12" cy="5" r="2.5" />
    <circle cx="5" cy="19" r="2.5" />
    <circle cx="19" cy="19" r="2.5" />
    <path d="M12 7.5v4M12 11.5l-6 5.5M12 11.5l6 5.5" /></svg

<ng-template appNavIcon="system"
  ><svg viewBox="0 0 24 24">
    <rect x="3" y="4" width="18" height="12" rx="2" />
    <path d="M8 20h8M12 16v4" /></svg
></ng-template>
<ng-template appNavIcon="endpoints"
  ><svg viewBox="0 0 24 24">
    <rect x="3" y="4" width="18" height="6" rx="1.5" />
    <rect x="3" y="14" width="18" height="6" rx="1.5" />
    <path d="M7 7h.01M7 17h.01" /></svg
></ng-template>
<ng-template appNavIcon="settings"
  ><svg viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3" />
    <path
      d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"
    /></svg
></ng-template>

<hx-app-shell
  [(sidebarWidth)]="shell.sidebarWidth"
  [(collapsed)]="shell.collapsed"
  [(activeId)]="shell.activeId"
>
  <hx-activity-bar
    slot="activity"
    label="Views"
    [items]="barItems()"
    [activeId]="shell.activeId()"
    [expanded]="!shell.collapsed()"
    (selected)="shell.select($event)"
  />

  <nav slot="sidebar" class="sidebar" [attr.aria-label]="shell.activeView().label">
    <h2>{{ shell.activeView().label }}</h2>
  </nav>

  <main class="content">
    <section class="empty" role="region" [attr.aria-label]="shell.activeView().label">
      <img src="favicon.svg" alt="" width="64" height="64" />
      <h1>{{ shell.activeView().label }}</h1>
      <p>{{ shell.activeView().description }}</p>
    </section>
  </main>

  <hx-status-bar slot="status">
    <hx-status-item
      slot="start"
      class="endpoint"
      [tone]="shell.connection() === 'unreachable' ? 'error' : 'neutral'"
      [announce]="true"
    >
      <span class="dot" [attr.data-state]="shell.connection()"></span>
      {{ shell.endpointName() }} · {{ connectionLabel() }}
    </hx-status-item>
    @if (shell.engineVersion(); as version) {
    <hx-status-version slot="end" class="engine-version" [version]="'Docker ' + version" />
    }
    <hx-status-app-version slot="end" />
  </hx-status-bar>
</hx-app-shell>
