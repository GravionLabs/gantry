[workspace]
resolver = "3"
members = ["crates/gantry-core", "src-tauri"]
default-members = ["crates/gantry-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Jerome Kaufmann"]
repository = "https://github.com/GravionLabs/gantry"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gantry-core = { path = "crates/gantry-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
