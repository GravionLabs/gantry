<section class="terminals" aria-label="Terminals">
  @if (!running()) {
  <hx-message severity="warn" role="status">
    The container is not running. Start it to open a terminal.
  </hx-message>
  }
  <form class="options" novalidate (submit)="$event.preventDefault(); open()">
    <div class="fields">
      <hx-field label="Shell">
        <hx-select
          optionValue="id"
          [options]="shells"
          [value]="shell()"
          (valueChange)="setShell($event ?? 'sh')"
        />
      </hx-field>
      @if (shell() === 'custom') {
      <hx-field
        class="command-field"
        label="Command"
        hint="Program and arguments, for example /bin/zsh -l"
        required
      >
        <input hx-input type="text" class="mono" [formField]="terminalForm.custom" />
      </hx-field>
      }
      <hx-field class="user-field" label="User" hint="Empty for the container's default user.">
        <input hx-input type="text" [formField]="terminalForm.user" />
      </hx-field>
    </div>
    <!-- A press keeps the focus: the error of a field that is left would move the button. -->
    <div (mousedown)="$event.preventDefault()">
      <button hx-button type="submit" [disabled]="!running()">Open terminal</button>
    </div>
  </form>
  @if (tabs().length) {
  <hx-tab-bar
    ariaLabel="Terminals"
    [tabs]="barTabs()"
    [value]="activeId() === null ? null : '' + activeId()"
    (valueChange)="select(+$event!)"
    (closed)="close(+$event)"
  />
  @for (t of tabs(); track t.id) {
  <app-terminal-session
    role="tabpanel"
    [hidden]="t.id !== activeId()"
    [active]="t.id === activeId()"
    [endpoint]="endpoint()"
    [containerId]="containerId()"
    [command]="t.command"
    [user]="t.user"
  />
  } } @else {
  <p class="empty" role="status">No terminal open. Choose a shell and open one.</p>
  }
</section>
