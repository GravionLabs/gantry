# Pushes to a release branch, handled by the reusable workflow release-branch.yml of GravionLabs/ci: keeps the release PR
# release/next -> main open and current, closes the issues merged into the branch and syncs the project field Needs.
# project-url is project 17 of GravionLabs.
# CI_APP_ID and CI_APP_PRIVATE_KEY: the GitHub App GravionLabs CI (a PR created with the GITHUB_TOKEN triggers no required checks).
# PROJECT_TOKEN (optional): classic PAT with scope project.
# Run once without a push: gh workflow run release-branch.yml --ref release/next
name: Release branch

on:
  push:
    branches: ["release/**"]

permissions: {}

jobs:
  release-branch:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: GravionLabs/ci/.github/workflows/release-branch.yml@a4dc7df4dca51c5402b2e440451f59cb13ea5259 # v1.18.0
    with:
      project-url: https://github.com/users/GravionLabs/projects/17
    secrets:
      CI_APP_ID: ${{ secrets.CI_APP_ID }}
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
