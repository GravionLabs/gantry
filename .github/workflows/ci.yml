name: CI

# Checks for pull requests into main (a finished release branch) and pushes to release branches.
# Installers are built only by release.yml on main, see the CI cost rule of GravionLabs.
on:
  pull_request:
    branches: [main]
  push:
    branches: ["release/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: frontend (lint, format, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: GravionLabs/ci/rust/setup@v1
        with:
          tauri-linux-deps: "true"
      # tauri::generate_context! embeds the built frontend.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Aggregate check: the rulesets require only "ci", so build jobs can be renamed or split
  # without editing them. A skipped or cancelled needed job counts as a failure.
  ci:
    name: ci
    if: ${{ always() }}
    needs: [frontend, rust]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all build jobs to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "::error::a needed job finished with '$r'"; exit 1; }
          done
