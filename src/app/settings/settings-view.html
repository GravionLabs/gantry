<section class="settings" aria-label="Settings">
  <nav class="categories" aria-label="Settings categories">
    <h1>Settings</h1>
    <ul>
      @for (category of categories; track category.id) {
      <li>
        <button
          type="button"
          [class.active]="category.id === selected().id"
          [attr.aria-current]="category.id === selected().id ? 'page' : null"
          (click)="select(category.id)"
        >
          {{ category.label }}
        </button>
      </li>
      }
    </ul>
  </nav>
  <div class="page" role="region" [attr.aria-label]="selected().label">
    <h2>{{ selected().label }}</h2>
    <p class="hint">{{ selected().description }}</p>
    @if (selected().id === 'appearance') {
    <fieldset class="theme">
      <legend>Theme</legend>
      @for (choice of themeChoices; track choice.id) {
      <label>
        <input
          type="radio"
          name="theme"
          [value]="choice.id"
          [checked]="settings.appearance().theme === choice.id"
          (change)="chooseTheme(choice.id)"
        />
        {{ choice.label }}
      </label>
      }
    </fieldset>
    } @if (settings.error(); as message) {
    <p class="problem" role="alert">{{ message }}</p>
    }
  </div>
</section>
