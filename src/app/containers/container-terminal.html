<section class="terminals" aria-label="Terminals">
  @if (!running()) {
  <hx-message severity="warn" role="status">
    The container is not running. Start it to open a terminal.
  </hx-message>
  }
  <div class="options">
    <hx-field label="Shell">
      <hx-select
        optionValue="id"
        [options]="shells"
        [value]="shell()"
        (valueChange)="setShell($event ?? 'sh')"
      />
    </hx-field>
    @if (shell() === 'custom') {
    <hx-field label="Command">
      <input
        hx-input
        type="text"
        class="command mono"
        placeholder="/bin/zsh -l"
        [value]="custom()"
        (input)="custom.set($any($event.target).value)"
        (keydown)="onCustomKey($event)"
      />
    </hx-field>
    }
    <hx-field label="User">
      <input
        hx-input
        type="text"
        class="user"
        placeholder="container default"
        [value]="user()"
        (input)="user.set($any($event.target).value)"
        (keydown)="onCustomKey($event)"
      />
    </hx-field>
    <button hx-button type="button" [disabled]="!running()" (click)="open()">Open terminal</button>
  </div>
  @if (problem(); as message) {
  <hx-message severity="error" role="alert">{{ message }}</hx-message>
  } @if (tabs().length) {
  <hx-tab-bar
    ariaLabel="Terminals"
    [tabs]="barTabs()"
    [value]="activeId() === null ? null : '' + activeId()"
    (valueChange)="select(+$event!)"
    (closed)="close(+$event)"
  />
  @for (t of tabs(); track t.id) {
  <app-terminal-session
    role="tabpanel"
    [hidden]="t.id !== activeId()"
    [active]="t.id === activeId()"
    [endpoint]="endpoint()"
    [containerId]="containerId()"
    [command]="t.command"
    [user]="t.user"
  />
  } } @else {
  <p class="empty" role="status">No terminal open. Choose a shell and open one.</p>
  }
</section>
